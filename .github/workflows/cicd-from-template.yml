name: MyJavaApp

on:
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  build:
    uses: reddeppa-org/ci-template/.github/workflows/java_build_reusable_template.yml@main
    with:
      use_maven: true           # or false, as needed
      use_gradle: false         # or true, as needed
      java_version: '17'        # or any version you want
      java_distribution: 'temurin' # or 'zulu', 'adopt', etc.
      application_name: 'my-java-app'
      branch: 'development'            # or any branch you want to build
      runner: 'windows-latest'  # or 'ubuntu-latest', etc.
      environment: 'dev'           # or set to your environment name if needed
      run_tests: false        # or set to your environment name if needed      
      custom_script: 'echo Hello from wrapper! Build Completed Successfully Verify the Artifacts'

  
  security-gate:
    needs: build
    uses: reddeppa-org/ci-template/.github/workflows/gate_security.yml@main
    with:
      repo_owner: "${{ github.repository_owner }}"
      repo_name: "${{ github.repository }}"
    secrets:
      pat_token: ${{ secrets.PAT_TOKEN }} 
  
   
  deploy-dev:
    needs: security-gate
    if: github.ref == 'refs/heads/development'
    uses: reddeppa-org/ci-template/.github/workflows/java_release_reusable_template.yml@main
    with:
      app_name: myapp
      war_path: ./target/myapp.war
      env_name: dev
    secrets:
      remote_host: ${{ secrets.REMOTE_HOST }}
      remote_user: ${{ secrets.REMOTE_USER }}
      remote_password: ${{ secrets.REMOTE_PASSWORD }}
    

  deploy-test:
    needs: security-gate
    if: github.ref == 'refs/heads/development'
    uses: reddeppa-org/ci-template/.github/workflows/java_release_reusable_template.yml@main
    with:
      app_name: myapp
      war_path: ./target/myapp.war
      env_name: test
    secrets:
      remote_host: ${{ secrets.REMOTE_HOST }}
      remote_user: ${{ secrets.REMOTE_USER }}
      remote_password: ${{ secrets.REMOTE_PASSWORD }}
    

  deploy-stage:
    needs: security-gate
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: reddeppa-org/ci-template/.github/workflows/java_release_reusable_template.yml@main
    with:
      app_name: myapp
      war_path: ./target/myapp.war
      env_name: stage
    secrets:
      remote_host: ${{ secrets.REMOTE_HOST }}
      remote_user: ${{ secrets.REMOTE_USER }}
      remote_password: ${{ secrets.REMOTE_PASSWORD }}
    

  deploy-prod:
    needs: security-gate
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: reddeppa-org/ci-template/.github/workflows/java_release_reusable_template.yml@main
    with:
      app_name: myapp
      war_path: ./target/myapp.war
      env_name: prod
    secrets:
      remote_host: ${{ secrets.REMOTE_HOST }}
      remote_user: ${{ secrets.REMOTE_USER }}
      remote_password: ${{ secrets.REMOTE_PASSWORD }}
    
