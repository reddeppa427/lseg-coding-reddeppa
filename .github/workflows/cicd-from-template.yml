name: MyJavaApp

on:
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

env:
  USE_MAVEN: true
  USE_GRADLE: false
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  APPLICATION_NAME: 'my-java-app'
  BRANCH: 'development'
  RUNNER: 'windows-latest'
  ENVIRONMENT: 'dev'
  RUN_TESTS: false
  CUSTOM_SCRIPT: 'echo Hello from wrapper! Build Completed Successfully Verify the Artifacts'

jobs:
  build:
    uses: reddeppa-org/ci-template/.github/workflows/java_build_reusable_template.yml@main
    with:
      use_maven: ${{ env.USE_MAVEN }}
      use_gradle: ${{ env.USE_GRADLE }}
      java_version: ${{ env.JAVA_VERSION }}
      java_distribution: ${{ env.JAVA_DISTRIBUTION }}
      application_name: ${{ env.APPLICATION_NAME }}
      branch: ${{ env.BRANCH }}
      runner: ${{ env.RUNNER }}
      environment: ${{ env.ENVIRONMENT }}
      run_tests: ${{ env.RUN_TESTS }}
      custom_script: ${{ env.CUSTOM_SCRIPT }}
